plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.mka23.arisu'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mka23.arisu'
        minSdk 23
        targetSdk 32
        versionCode 2
        versionName '0.2.0'
    }

    // Keep Java and Kotlin bytecode targets aligned for the JDK 17 build.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
